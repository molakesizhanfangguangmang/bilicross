name: Cloud build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  android-arm64:
    name: Android arm64 (API 26+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_CHANNEL" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate platform shell
        shell: bash
        run: |
          flutter --version
          flutter create --platforms=android --org io.github.molakesizhanfangguangmang --project-name bilicross .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import re
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              replacements = {
                  'minSdk = flutter.minSdkVersion': 'minSdk = 26',
                  'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 26',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.suffix == '.kts':
                  text = re.sub(
                      r'(android\s*\{\n)',
                      r'\1    packaging {\n'
                      r'        jniLibs {\n'
                      r'            excludes += listOf("**/armeabi-v7a/**", "**/x86/**", "**/x86_64/**")\n'
                      r'        }\n'
                      r'    }\n',
                      text,
                      count=1,
                  )
              else:
                  text = re.sub(
                      r'(android\s*\{\n)',
                      r'\1    packagingOptions {\n'
                      r'        jniLibs {\n'
                      r"            excludes += ['**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']\n"
                      r'        }\n'
                      r'    }\n',
                      text,
                      count=1,
                  )
              path.write_text(text)
              if 'minSdk = 26' not in text and 'minSdkVersion 26' not in text:
                  raise SystemExit(f'Failed to set Android minSdk 26 in {path}')
              if 'jniLibs' not in text:
                  raise SystemExit(f'Failed to exclude non-arm64 ABIs in {path}')
              print(f'Configured {path} for Android 8.0+ and arm64-v8a only')
              break
          else:
              raise SystemExit('Android Gradle app file not found')

          # 模板只在 debug/profile 清单里声明 INTERNET，release 包需要自己补。
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  text,
                  count=1,
              )
          if '<queries>' not in text:
              queries = (
                  '\n    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="https"/>\n'
                  '        </intent>\n'
                  '    </queries>\n'
              )
              text = text.replace('<application', queries + '    <application', 1)
          manifest.write_text(text)
          written = manifest.read_text()
          for needle in ('android.permission.INTERNET', '<queries>'):
              if needle not in written:
                  raise SystemExit(f'Failed to inject {needle}')
          print('Android manifest patched')

          # 应用标识沿用首版包名：项目更名不改应用身份，旧版可以直接覆盖安装，
          # 应用私有目录里的设置、凭据、任务与已下载文件都留在原处。
          gradle = Path('android/app/build.gradle.kts')
          text, pinned = re.subn(
              r'applicationId = "[^"]*"',
              'applicationId = "io.github.molakesizhanfangguangmang.biliharbor"',
              gradle.read_text(),
          )
          if pinned != 1:
              raise SystemExit('未能锁定 Android applicationId')
          gradle.write_text(text)

          # 图标与显示名：仓库里的 packaging/android/res 覆盖模板图标（含自适应图标）。
          import shutil
          source = Path('packaging/android/res')
          dest = Path('android/app/src/main/res')
          for folder in sorted(source.iterdir()):
              target = dest / folder.name
              target.mkdir(parents=True, exist_ok=True)
              for item in sorted(folder.iterdir()):
                  shutil.copy2(item, target / item.name)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text, named = re.subn(r'android:label="[^"]*"', 'android:label="逸轨"', manifest.read_text())
          if named != 1:
              raise SystemExit('未能设置应用显示名')
          manifest.write_text(text)
          for needle in ('android:label="逸轨"',):
              if needle not in manifest.read_text():
                  raise SystemExit(f'显示名注入失败：缺少 {needle}')
          adaptive = Path('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')
          colors = Path('android/app/src/main/res/values/colors.xml')
          icons = list(Path('android/app/src/main/res').glob('mipmap-*/ic_launcher.png'))
          if not adaptive.exists() or '@color/ic_launcher_background' not in adaptive.read_text():
              raise SystemExit('自适应图标未写入')
          if not colors.exists() or 'ic_launcher_background' not in colors.read_text():
              raise SystemExit('图标背景色未写入')
          if len(icons) < 5:
              raise SystemExit(f'图标密度不全：{sorted(p.name for p in icons)}')
          print('图标、显示名与包名标识已写入')
          PY

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "缺少 ANDROID_KEYSTORE_* secrets，拒绝出包：否则会用临时 debug 密钥签名，装不上去。" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bilicross-release.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/bilicross-release.p12" -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEYSTORE_PASSWORD" \
            -destkeystore android/app/release.jks -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destalias "$KEY_ALIAS" -destkeypass "$KEYSTORE_PASSWORD"
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          if not path.exists():
              raise SystemExit('Android Gradle 脚本不存在，无法注入签名配置')
          text = path.read_text()
          if 'bilicrossSigning' in text:
              raise SystemExit('发布签名配置已存在')
          text += """
          // 由 CI 注入：用仓库 secrets 里的固定发布密钥签名，保证升级安装可用。
          // 不引 java.util.Properties：脚本里 java 是 Gradle 的 java 扩展，会把包名遮掉。
          val bilicrossSigningFile = rootProject.file("key.properties")
          if (bilicrossSigningFile.exists()) {
              val bilicrossSigning = mutableMapOf<String, String>()
              bilicrossSigningFile.readLines().forEach { line ->
                  val cut = line.indexOf('=')
                  if (cut > 0) {
                      bilicrossSigning[line.substring(0, cut).trim()] = line.substring(cut + 1).trim()
                  }
              }
              android {
                  signingConfigs {
                      create("bilicrossSigning") {
                          storeFile = file(bilicrossSigning.getValue("storeFile"))
                          storePassword = bilicrossSigning.getValue("storePassword")
                          keyAlias = bilicrossSigning.getValue("keyAlias")
                          keyPassword = bilicrossSigning.getValue("keyPassword")
                      }
                  }
                  buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("bilicrossSigning")
                      }
                  }
              }
          }
          """
          path.write_text(text)
          written = path.read_text()
          for needle in ('bilicrossSigning', 'getByName("release")', 'storeFile = file('):
              if needle not in written:
                  raise SystemExit(f'签名配置注入失败：缺少 {needle}')
          print('Release signing configured from CI secrets')
          PY
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" | sed -n '1,12p'

      - name: Check and test
        shell: bash
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK architecture
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          if unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library in APK' >&2
            unzip -l "$apk" | grep -E 'lib/' >&2
            exit 1
          fi
          sha256sum "$apk" | tee "$apk.sha256"
          python3 - <<'PY'
          import zipfile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          package = zipfile.ZipFile(apk)
          manifest = package.read('AndroidManifest.xml')
          arsc = package.read('resources.arsc')
          expected = {
              'applicationId': 'io.github.molakesizhanfangguangmang.biliharbor',
              '显示名': '逸轨',
          }
          for label, text in expected.items():
              found = any(
                  text.encode(encoding) in blob
                  for encoding in ('utf-16-le', 'utf-8')
                  for blob in (manifest, arsc)
              )
              print(f'{label}: {"ok" if found else "missing"}')
              if not found:
                  raise SystemExit(f'APK 里找不到 {label}（{text}）')
          PY

      - name: Verify APK signing
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$tools" ] || [ ! -x "$tools/apksigner" ]; then
            echo '未找到 apksigner，跳过签名核对' >&2
            exit 0
          fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" | grep -Ei 'Verified using|certificate DN|SHA-256 digest'
          if "$tools/apksigner" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
            echo 'APK 仍由 debug 密钥签名，发布密钥没有生效' >&2
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliCross-android-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_CHANNEL https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate platform shell
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org io.github.molakesizhanfangguangmang --project-name bilicross .
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue

      - name: Apply icon and window title
        shell: pwsh
        run: |
          Copy-Item packaging\windows\app_icon.ico windows\runner\resources\app_icon.ico -Force
          if (-not (Test-Path windows\runner\resources\app_icon.ico)) { throw '图标未写入' }
          $main = 'windows\runner\main.cpp'
          $text = Get-Content $main -Raw
          $text = $text -replace 'window\.Create\(L"[^"]*"', 'window.Create(L"\u9038\u8f68"'
          Set-Content $main $text -NoNewline -Encoding utf8
          if (-not (Select-String -Path $main -SimpleMatch 'u9038')) { throw '未能设置窗口标题' }
          Select-String -Path $main -Pattern 'window\.Create'

      - name: Check and test
        shell: pwsh
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Package and checksum
        shell: pwsh
        run: |
          $source = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$source\bilicross.exe")) { throw 'Windows executable not found' }
          Compress-Archive -Path "$source\*" -DestinationPath BiliCross-windows-x64.zip
          $hash = (Get-FileHash BiliCross-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BiliCross-windows-x64.zip" | Set-Content BiliCross-windows-x64.zip.sha256 -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliCross-windows-x64
          path: |
            BiliCross-windows-x64.zip
            BiliCross-windows-x64.zip.sha256
          if-no-files-found: error
