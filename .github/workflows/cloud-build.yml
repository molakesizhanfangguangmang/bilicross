name: Cloud build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  android-arm64:
    name: Android arm64 (API 26+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_CHANNEL" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate platform shell
        shell: bash
        run: |
          flutter --version
          flutter create --platforms=android --org io.github.molakesizhanfangguangmang --project-name biliharbor .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              replacements = {
                  'minSdk = flutter.minSdkVersion': 'minSdk = 26',
                  'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 26',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
              if 'minSdk = 26' not in text and 'minSdkVersion 26' not in text:
                  raise SystemExit(f'Failed to set Android minSdk 26 in {path}')
              print(f'Configured {path} for Android 8.0+')
              break
          else:
              raise SystemExit('Android Gradle app file not found')
          PY

      - name: Check and test
        shell: bash
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK architecture
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          if unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/libflutter.so'; then
            echo 'Unexpected non-arm64 Flutter library in APK' >&2
            exit 1
          fi
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliHarbor-android-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_CHANNEL https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate platform shell
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org io.github.molakesizhanfangguangmang --project-name biliharbor .
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue

      - name: Check and test
        shell: pwsh
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Package and checksum
        shell: pwsh
        run: |
          $source = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$source\biliharbor.exe")) { throw 'Windows executable not found' }
          Compress-Archive -Path "$source\*" -DestinationPath BiliHarbor-windows-x64.zip
          $hash = (Get-FileHash BiliHarbor-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BiliHarbor-windows-x64.zip" | Set-Content BiliHarbor-windows-x64.zip.sha256 -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliHarbor-windows-x64
          path: |
            BiliHarbor-windows-x64.zip
            BiliHarbor-windows-x64.zip.sha256
          if-no-files-found: error
