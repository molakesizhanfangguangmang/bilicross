name: Cloud build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  android-arm64:
    name: Android arm64 (API 26+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_CHANNEL" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate platform shell
        shell: bash
        run: |
          flutter --version
          flutter create --platforms=android --org io.github.molakesizhanfangguangmang --project-name bilicross .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import re
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              replacements = {
                  'minSdk = flutter.minSdkVersion': 'minSdk = 26',
                  'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 26',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.suffix == '.kts':
                  text = re.sub(
                      r'(android\s*\{\n)',
                      r'\1    packaging {\n'
                      r'        jniLibs {\n'
                      r'            excludes += listOf("**/armeabi-v7a/**", "**/x86/**", "**/x86_64/**")\n'
                      r'        }\n'
                      r'    }\n',
                      text,
                      count=1,
                  )
              else:
                  text = re.sub(
                      r'(android\s*\{\n)',
                      r'\1    packagingOptions {\n'
                      r'        jniLibs {\n'
                      r"            excludes += ['**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']\n"
                      r'        }\n'
                      r'    }\n',
                      text,
                      count=1,
                  )
              path.write_text(text)
              if 'minSdk = 26' not in text and 'minSdkVersion 26' not in text:
                  raise SystemExit(f'Failed to set Android minSdk 26 in {path}')
              if 'jniLibs' not in text:
                  raise SystemExit(f'Failed to exclude non-arm64 ABIs in {path}')
              print(f'Configured {path} for Android 8.0+ and arm64-v8a only')
              break
          else:
              raise SystemExit('Android Gradle app file not found')

          # 模板只在 debug/profile 清单里声明 INTERNET，release 包需要自己补。
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  text,
                  count=1,
              )
          if '<queries>' not in text:
              queries = (
                  '\n    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="https"/>\n'
                  '        </intent>\n'
                  '    </queries>\n'
              )
              text = text.replace('<application', queries + '    <application', 1)
          manifest.write_text(text)
          written = manifest.read_text()
          for needle in ('android.permission.INTERNET', '<queries>'):
              if needle not in written:
                  raise SystemExit(f'Failed to inject {needle}')
          print('Android manifest patched')

          # 应用标识沿用首版包名：项目更名不改应用身份，旧版可以直接覆盖安装，
          # 应用私有目录里的设置、凭据、任务与已下载文件都留在原处。
          gradle = Path('android/app/build.gradle.kts')
          text, pinned = re.subn(
              r'applicationId = "[^"]*"',
              'applicationId = "io.github.molakesizhanfangguangmang.biliharbor"',
              gradle.read_text(),
          )
          if pinned != 1:
              raise SystemExit('未能锁定 Android applicationId')
          gradle.write_text(text)

          # 图标与显示名：仓库里的 packaging/android/res 覆盖模板图标（含自适应图标）。
          import shutil
          source = Path('packaging/android/res')
          dest = Path('android/app/src/main/res')
          for folder in sorted(source.iterdir()):
              target = dest / folder.name
              target.mkdir(parents=True, exist_ok=True)
              for item in sorted(folder.iterdir()):
                  shutil.copy2(item, target / item.name)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text, named = re.subn(r'android:label="[^"]*"', 'android:label="逸轨"', manifest.read_text())
          if named != 1:
              raise SystemExit('未能设置应用显示名')
          manifest.write_text(text)
          for needle in ('android:label="逸轨"',):
              if needle not in manifest.read_text():
                  raise SystemExit(f'显示名注入失败：缺少 {needle}')
          adaptive = Path('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')
          colors = Path('android/app/src/main/res/values/colors.xml')
          icons = list(Path('android/app/src/main/res').glob('mipmap-*/ic_launcher.png'))
          if not adaptive.exists() or '@color/ic_launcher_background' not in adaptive.read_text():
              raise SystemExit('自适应图标未写入')
          if not colors.exists() or 'ic_launcher_background' not in colors.read_text():
              raise SystemExit('图标背景色未写入')
          if len(icons) < 5:
              raise SystemExit(f'图标密度不全：{sorted(p.name for p in icons)}')
          print('图标、显示名与包名标识已写入')
          PY

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "缺少 ANDROID_KEYSTORE_* secrets，拒绝出包：否则会用临时 debug 密钥签名，装不上去。" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bilicross-release.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/bilicross-release.p12" -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEYSTORE_PASSWORD" \
            -destkeystore android/app/release.jks -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destalias "$KEY_ALIAS" -destkeypass "$KEYSTORE_PASSWORD"
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          if not path.exists():
              raise SystemExit('Android Gradle 脚本不存在，无法注入签名配置')
          text = path.read_text()
          if 'bilicrossSigning' in text:
              raise SystemExit('发布签名配置已存在')
          text += """
          // 由 CI 注入：用仓库 secrets 里的固定发布密钥签名，保证升级安装可用。
          // 不引 java.util.Properties：脚本里 java 是 Gradle 的 java 扩展，会把包名遮掉。
          val bilicrossSigningFile = rootProject.file("key.properties")
          if (bilicrossSigningFile.exists()) {
              val bilicrossSigning = mutableMapOf<String, String>()
              bilicrossSigningFile.readLines().forEach { line ->
                  val cut = line.indexOf('=')
                  if (cut > 0) {
                      bilicrossSigning[line.substring(0, cut).trim()] = line.substring(cut + 1).trim()
                  }
              }
              android {
                  signingConfigs {
                      create("bilicrossSigning") {
                          storeFile = file(bilicrossSigning.getValue("storeFile"))
                          storePassword = bilicrossSigning.getValue("storePassword")
                          keyAlias = bilicrossSigning.getValue("keyAlias")
                          keyPassword = bilicrossSigning.getValue("keyPassword")
                      }
                  }
                  buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("bilicrossSigning")
                      }
                  }
              }
          }
          """
          path.write_text(text)
          written = path.read_text()
          for needle in ('bilicrossSigning', 'getByName("release")', 'storeFile = file('):
              if needle not in written:
                  raise SystemExit(f'签名配置注入失败：缺少 {needle}')
          print('Release signing configured from CI secrets')
          PY
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" | sed -n '1,12p'

      # 拆成四步：失败时步骤名直接指出是哪条命令挂了，不必翻日志。
      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      # flutter_inappwebview_android 1.1.3 的 build.gradle 仍用已废弃的
      # getDefaultProguardFile('proguard-android.txt')，新版 AGP 已移除该文件，编译直接失败。
      # 替换为 AGP 推荐的 proguard-android-optimize.txt（等价且受支持）。仅改插件缓存副本，不碰仓库。
      - name: Patch in-app WebView Android plugin for current AGP
        shell: bash
        run: |
          f=$(find "$HOME/.pub-cache" -path '*flutter_inappwebview_android*/android/build.gradle' 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "未找到 flutter_inappwebview_android 的 build.gradle，跳过补丁（路径可能已变，需复查）"
            exit 0
          fi
          echo "patching $f"
          sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
          grep -n 'proguard-android' "$f"

      - name: Check formatting
        shell: bash
        run: dart format lib test

      # 按目录分开跑：analyze 报错时，失败的步骤名直接指出问题在哪个目录。
      - name: Analyze core
        shell: bash
        run: flutter analyze lib/src/core

      - name: Analyze ui
        shell: bash
        run: flutter analyze lib/src/ui

      - name: Analyze tests
        shell: bash
        run: flutter analyze test

      - name: Analyze whole project
        shell: bash
        run: flutter analyze

      - name: Run tests
        shell: bash
        run: flutter test

      - name: Build release APK
        shell: bash
        # 备份密钥通过 Secret 注入；GitHub 会自动遮蔽 Secret 的值，日志里不会出现。
        # 测试另有独立测试密钥，不使用这里的值。
        env:
          BACKUP_KEY_DEFINE: --dart-define=BILICROSS_BACKUP_KEY_V1=${{ secrets.BILICROSS_BACKUP_KEY_V1 }}
        run: flutter build apk --release --target-platform android-arm64 $BACKUP_KEY_DEFINE

      - name: Verify APK architecture
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          if unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library in APK' >&2
            unzip -l "$apk" | grep -E 'lib/' >&2
            exit 1
          fi
          sha256sum "$apk" | tee "$apk.sha256"
          python3 - <<'PY'
          import zipfile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          package = zipfile.ZipFile(apk)
          manifest = package.read('AndroidManifest.xml')
          arsc = package.read('resources.arsc')
          expected = {
              'applicationId': 'io.github.molakesizhanfangguangmang.biliharbor',
              '显示名': '逸轨',
          }
          for label, text in expected.items():
              found = any(
                  text.encode(encoding) in blob
                  for encoding in ('utf-16-le', 'utf-8')
                  for blob in (manifest, arsc)
              )
              print(f'{label}: {"ok" if found else "missing"}')
              if not found:
                  raise SystemExit(f'APK 里找不到 {label}（{text}）')
          PY

      - name: Verify APK version
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$tools" ] || [ ! -x "$tools/aapt" ]; then
            echo '未找到 aapt，无法校验 APK 版本号' >&2
            exit 1
          fi
          badging=$("$tools/aapt" dump badging "$apk")
          echo "$badging" | grep -E "^package:" | sed -n '1p'
          echo "$badging" | grep -F "versionCode='17'"
          echo "$badging" | grep -F "versionName='1.0.7'"

      - name: Verify APK signing
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$tools" ] || [ ! -x "$tools/apksigner" ]; then
            echo '未找到 apksigner，跳过签名核对' >&2
            exit 0
          fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" | grep -Ei 'Verified using|certificate DN|SHA-256 digest'
          if "$tools/apksigner" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
            echo 'APK 仍由 debug 密钥签名，发布密钥没有生效' >&2
            exit 1
          fi

      - name: Name APK after version and ABI
        shell: bash
        run: |
          # gradle 默认产物名是 app-release.apk，不含版本与架构。
          # 发布产物统一成 BiliCross-<版本>-android-arm64.apk，
          # 应用内更新按名字挑包时才能与 Windows 包用同一套规则。
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$version" ]; then
            echo '未从 pubspec.yaml 读到版本号' >&2
            exit 1
          fi
          cd build/app/outputs/flutter-apk
          target="BiliCross-${version}-android-arm64.apk"
          mv app-release.apk "$target"
          if [ -f app-release.apk.sha256 ]; then
            sum=$(cut -d' ' -f1 app-release.apk.sha256)
            rm -f app-release.apk.sha256
            printf '%s  %s\n' "$sum" "$target" > "$target.sha256"
          fi
          ls -la

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliCross-android-arm64
          path: |
            build/app/outputs/flutter-apk/BiliCross-*-android-arm64.apk
            build/app/outputs/flutter-apk/BiliCross-*-android-arm64.apk.sha256
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_CHANNEL https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate platform shell
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org io.github.molakesizhanfangguangmang --project-name bilicross .
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue

      - name: Apply icon and window title
        shell: pwsh
        run: |
          Copy-Item packaging\windows\app_icon.ico windows\runner\resources\app_icon.ico -Force
          if (-not (Test-Path windows\runner\resources\app_icon.ico)) { throw '图标未写入' }
          $main = 'windows\runner\main.cpp'
          $text = Get-Content $main -Raw
          $text = $text -replace 'window\.Create\(L"[^"]*"', 'window.Create(L"\u9038\u8f68"'
          Set-Content $main $text -NoNewline -Encoding utf8
          if (-not (Select-String -Path $main -SimpleMatch 'u9038')) { throw '未能设置窗口标题' }
          Select-String -Path $main -Pattern 'window\.Create'

      # Flutter 首帧上屏之前，窗口显示的是系统默认白底；开了启动画面时尤其突兀。
      # 给窗口挂深色画刷并立即重绘。只改 windows/runner/main.cpp（该目录不入仓）。
      # 注入逻辑放在 packaging/windows/patch-dark-background.js：脚本要处理 BOM 与
      # 编码细节，直接写在 YAML 里既难读，也容易因缩进破坏整个文件的结构。
      - name: Use dark background before first frame
        run: node packaging/windows/patch-dark-background.js

      # flutter_inappwebview_windows 0.6.0 的 C++ 用了 <experimental/coroutine> + /await，
      # 新版 MSVC（CI 上是 14.51）把它升级成硬错误（STL1011）。定义
      # _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS 抑制该 static_assert，让插件照常编译。
      # 仅注入到 windows/CMakeLists.txt（每次 flutter create 重生），不改应用代码、不改插件源码。
      - name: Patch Windows toolchain for in-app WebView2 plugin
        shell: pwsh
        run: |
          $cmake = 'windows\CMakeLists.txt'
          if (-not (Test-Path $cmake)) { throw "未找到 $cmake" }
          $text = Get-Content $cmake -Raw
          if ($text -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
            $text = $text -replace 'cmake_minimum_required\(VERSION (\d+\.\d+)\)', "cmake_minimum_required(VERSION `$1)`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
            Set-Content $cmake $text -NoNewline -Encoding utf8
          }
          Select-String -Path $cmake -Pattern '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'

      # 同 Android：拆开跑，失败时看步骤名就知道是哪一步。
      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Check formatting
        shell: pwsh
        run: dart format lib test

      # 同 Android：按目录分开跑，失败时步骤名指出目录。
      - name: Analyze core
        shell: pwsh
        run: flutter analyze lib/src/core

      - name: Analyze ui
        shell: pwsh
        run: flutter analyze lib/src/ui

      - name: Analyze tests
        shell: pwsh
        run: flutter analyze test

      - name: Analyze whole project
        shell: pwsh
        run: flutter analyze

      - name: Run tests
        shell: pwsh
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        # 与 Android 同一个 Secret；值不会被打印到日志。
        # 同一份产物既给安装版也给便携版：便携版靠包里的 portable.marker 在运行期认通道，
        # 不必为两种包各编一次。
        env:
          BILICROSS_BACKUP_KEY_V1: ${{ secrets.BILICROSS_BACKUP_KEY_V1 }}
        run: |
          flutter build windows --release --dart-define=BILICROSS_BACKUP_KEY_V1="$env:BILICROSS_BACKUP_KEY_V1"

      # 捆绑 ffmpeg（BtbN LGPL win64）：用发布方 checksums.sha256 校验完整性，再解到 tools\ffmpeg\ffmpeg.exe。
      # 注意：BtbN 的 “latest” 发布不带校验和，只有带版本号的发布才带 checksums.sha256，
      # 因此这里取“最新的版本化发布”——既能拿到校验和做 SHA-256 校验，也顺带锁定当次构建用到的具体版本。
      # ffmpeg 不进仓库、不进 Release 说明，仅作运行期可选依赖；缺了会自动回落内置合并。
      # 匿名调 GitHub API 只有 60 次/小时，而 runner 是共享出口 IP，容易被别的任务
      # 用光（表现为 "API rate limit exceeded"）。带上 GITHUB_TOKEN 后额度是 5000 次/小时。
      - name: Fetch and verify ffmpeg (BtbN LGPL win64)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hdr = @{ 'User-Agent' = 'bilicross-ci'; 'Authorization' = "Bearer $env:GITHUB_TOKEN" }
          $list = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=10' -Headers $hdr
          $rel = $null; $assetName = $null; $zipUrl = $null; $sumsUrl = $null
          foreach ($r in $list) {
            if ($r.tag_name -eq 'latest') { continue }
            $zip = $r.assets | Where-Object { $_.name -match 'win64-lgpl\.zip$' -and $_.name -notmatch 'shared' } | Select-Object -First 1
            $sums = $r.assets | Where-Object { $_.name -eq 'checksums.sha256' } | Select-Object -First 1
            if ($zip -and $sums) { $rel = $r; $assetName = $zip.name; $zipUrl = $zip.browser_download_url; $sumsUrl = $sums.browser_download_url; break }
          }
          if (-not $rel) { throw '找不到带 checksums.sha256 的 FFmpeg 发布' }
          Write-Output ("选定 ffmpeg 版本: " + $rel.tag_name + " / " + $assetName)
          Invoke-WebRequest -Uri $zipUrl -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri $sumsUrl -OutFile checksums.sha256
          $line = Select-String -Path checksums.sha256 -Pattern "[0-9a-fA-F]{64}" | Where-Object { $_.Line -match [regex]::Escape($assetName) } | Select-Object -First 1
          if (-not $line) { throw "checksums.sha256 里找不到 $assetName 的校验值" }
          $expected = ($line.Line -replace '[^0-9a-fA-F].*$','').Trim().ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "ffmpeg SHA256 不匹配：期望 $expected 实际 $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $src = Get-ChildItem ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $src) { throw 'ffmpeg.exe 未找到' }
          New-Item tools\ffmpeg -ItemType Directory -Force | Out-Null
          Copy-Item $src.FullName tools\ffmpeg\ffmpeg.exe -Force
          Write-Output ("ffmpeg 就绪: " + (Get-Item tools\ffmpeg\ffmpeg.exe).Length + " 字节, sha256=" + $actual)

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          function Find-Iscc {
            (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            try { choco install innosetup -y --no-progress 2>$null } catch { }
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            $url = 'https://jrsoftware.org/download.php/is.exe'
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\innosetup.exe" -MaximumRedirection 10
            Start-Process "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw '未找到 ISCC.exe（Inno Setup 安装可能失败）' }
          & $iscc packaging\windows\BiliCross.iss
          if (-not (Test-Path BiliCross-windows-x64-setup.exe)) { throw '安装包未生成' }
          $hash = (Get-FileHash BiliCross-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BiliCross-windows-x64-setup.exe" | Set-Content BiliCross-windows-x64-setup.exe.sha256 -Encoding ascii

      # 便携版：同一份安装版产物，只在包里塞一个 portable.marker 让运行期认出便携通道，
      # 数据目录因此落到 <程序目录>\data。ffmpeg 也一并带进去。
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$rel\bilicross.exe")) { throw 'Windows executable not found' }
          New-Item dist-portable -ItemType Directory -Force | Out-Null
          Copy-Item "$rel\*" dist-portable -Recurse -Force
          New-Item dist-portable\tools\ffmpeg -ItemType Directory -Force | Out-Null
          Copy-Item tools\ffmpeg\ffmpeg.exe dist-portable\tools\ffmpeg\ffmpeg.exe -Force
          New-Item dist-portable\portable.marker -ItemType File -Force | Out-Null
          Compress-Archive -Path dist-portable\* -DestinationPath BiliCross-windows-x64-portable.zip -Force
          $hash = (Get-FileHash BiliCross-windows-x64-portable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BiliCross-windows-x64-portable.zip" | Set-Content BiliCross-windows-x64-portable.zip.sha256 -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliCross-windows-x64
          path: |
            BiliCross-windows-x64-setup.exe
            BiliCross-windows-x64-setup.exe.sha256
            BiliCross-windows-x64-portable.zip
            BiliCross-windows-x64-portable.zip.sha256
          if-no-files-found: error
