name: Cloud build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  android-arm64:
    name: Android arm64 (API 26+)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_CHANNEL" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate platform shell
        shell: bash
        run: |
          flutter --version
          flutter create --platforms=android --org io.github.molakesizhanfangguangmang --project-name biliharbor .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import re
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              replacements = {
                  'minSdk = flutter.minSdkVersion': 'minSdk = 26',
                  'minSdkVersion flutter.minSdkVersion': 'minSdkVersion 26',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.suffix == '.kts':
                  text = re.sub(
                      r'(android\s*\{\n)',
                      r'\1    packaging {\n'
                      r'        jniLibs {\n'
                      r'            excludes += listOf("**/armeabi-v7a/**", "**/x86/**", "**/x86_64/**")\n'
                      r'        }\n'
                      r'    }\n',
                      text,
                      count=1,
                  )
              else:
                  text = re.sub(
                      r'(android\s*\{\n)',
                      r'\1    packagingOptions {\n'
                      r'        jniLibs {\n'
                      r"            excludes += ['**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']\n"
                      r'        }\n'
                      r'    }\n',
                      text,
                      count=1,
                  )
              path.write_text(text)
              if 'minSdk = 26' not in text and 'minSdkVersion 26' not in text:
                  raise SystemExit(f'Failed to set Android minSdk 26 in {path}')
              if 'jniLibs' not in text:
                  raise SystemExit(f'Failed to exclude non-arm64 ABIs in {path}')
              print(f'Configured {path} for Android 8.0+ and arm64-v8a only')
              break
          else:
              raise SystemExit('Android Gradle app file not found')

          # 模板只在 debug/profile 清单里声明 INTERNET，release 包需要自己补。
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  text,
                  count=1,
              )
          if '<queries>' not in text:
              queries = (
                  '\n    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="https"/>\n'
                  '        </intent>\n'
                  '    </queries>\n'
              )
              text = text.replace('<application', queries + '    <application', 1)
          manifest.write_text(text)
          written = manifest.read_text()
          for needle in ('android.permission.INTERNET', '<queries>'):
              if needle not in written:
                  raise SystemExit(f'Failed to inject {needle}')
          print('Android manifest patched')
          PY

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "缺少 ANDROID_KEYSTORE_* secrets，拒绝出包：否则会用临时 debug 密钥签名，装不上去。" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/biliharbor-release.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/biliharbor-release.p12" -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEYSTORE_PASSWORD" \
            -destkeystore android/app/release.jks -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destalias "$KEY_ALIAS" -destkeypass "$KEYSTORE_PASSWORD"
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          if not path.exists():
              raise SystemExit('Android Gradle 脚本不存在，无法注入签名配置')
          text = path.read_text()
          if 'biliharborSigning' in text:
              raise SystemExit('发布签名配置已存在')
          text += """
          // 由 CI 注入：用仓库 secrets 里的固定发布密钥签名，保证升级安装可用。
          // 不引 java.util.Properties：脚本里 java 是 Gradle 的 java 扩展，会把包名遮掉。
          val biliharborSigningFile = rootProject.file("key.properties")
          if (biliharborSigningFile.exists()) {
              val biliharborSigning = mutableMapOf<String, String>()
              biliharborSigningFile.readLines().forEach { line ->
                  val cut = line.indexOf('=')
                  if (cut > 0) {
                      biliharborSigning[line.substring(0, cut).trim()] = line.substring(cut + 1).trim()
                  }
              }
              android {
                  signingConfigs {
                      create("biliharborSigning") {
                          storeFile = file(biliharborSigning.getValue("storeFile"))
                          storePassword = biliharborSigning.getValue("storePassword")
                          keyAlias = biliharborSigning.getValue("keyAlias")
                          keyPassword = biliharborSigning.getValue("keyPassword")
                      }
                  }
                  buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("biliharborSigning")
                      }
                  }
              }
          }
          """
          path.write_text(text)
          written = path.read_text()
          for needle in ('biliharborSigning', 'getByName("release")', 'storeFile = file('):
              if needle not in written:
                  raise SystemExit(f'签名配置注入失败：缺少 {needle}')
          print('Release signing configured from CI secrets')
          PY
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" | sed -n '1,12p'

      - name: Check and test
        shell: bash
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK architecture
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          if unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library in APK' >&2
            unzip -l "$apk" | grep -E 'lib/' >&2
            exit 1
          fi
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Verify APK signing
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$tools" ] || [ ! -x "$tools/apksigner" ]; then
            echo '未找到 apksigner，跳过签名核对' >&2
            exit 0
          fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" | grep -Ei 'Verified using|certificate DN|SHA-256 digest'
          if "$tools/apksigner" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
            echo 'APK 仍由 debug 密钥签名，发布密钥没有生效' >&2
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliHarbor-android-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter stable
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_CHANNEL https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate platform shell
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org io.github.molakesizhanfangguangmang --project-name biliharbor .
          Remove-Item test\widget_test.dart -ErrorAction SilentlyContinue

      - name: Check and test
        shell: pwsh
        run: |
          dart format lib test
          flutter analyze
          flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Package and checksum
        shell: pwsh
        run: |
          $source = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$source\biliharbor.exe")) { throw 'Windows executable not found' }
          Compress-Archive -Path "$source\*" -DestinationPath BiliHarbor-windows-x64.zip
          $hash = (Get-FileHash BiliHarbor-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BiliHarbor-windows-x64.zip" | Set-Content BiliHarbor-windows-x64.zip.sha256 -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliHarbor-windows-x64
          path: |
            BiliHarbor-windows-x64.zip
            BiliHarbor-windows-x64.zip.sha256
          if-no-files-found: error
