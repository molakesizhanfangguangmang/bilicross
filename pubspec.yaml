name: bilicross
description: 逸轨（BiliCross）：B 站媒体本地下载与整理客户端。
publish_to: none
version: 2.3.1+49

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^13.1.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  # 投票去重用的设备指纹（ANDROID_ID / Windows deviceId），只用哈希上报。
  # 之所以引插件而不是自写平台通道：自定义通道要落在 MainActivity.kt 上，
  # 那正是壳补丁（FLAG_SECURE）与壳自检闸门改的文件，而 android/ 不入库、
  # CI 现场生成 —— 自写通道在 CI 出的包里会静默失效。
  device_info_plus: ^13.2.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  window_manager: ^0.5.2
  # 给系统标题栏上色（DwmSetWindowAttribute）。ffi 是 win32 的依赖，显式列出。
  ffi: ^2.1.3
  win32: ^6.4.0
  # Windows 网页登录用：flutter_inappwebview（WebView2）。Android 继续用 webview_flutter，不替换。
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  # 设备上的集成测试（跑在真机/模拟器里）。备份的导出路径依赖
  # Platform.isAndroid 分支，宿主机上的 widget test 覆盖不到。
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - packaging/windows/app_icon.ico
