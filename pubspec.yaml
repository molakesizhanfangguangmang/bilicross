publish_to: none
version: 1.0.1+11

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  file_picker: ^13.1.0
  http: ^1.6.0
